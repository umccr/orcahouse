# The runner's profile. It replaces the one in the orcavault repository, which
# is for local development.
#
# iam_role connects as the ECS task role, through
# redshift-serverless:GetCredentials, so there is no user or password. The
# database user is IAMR:<task role name>.
orcavault:
  target: prod
  outputs:
    prod:
      type: redshift
      method: iam_role
      host: "{{ env_var('ORCAVAULT_REDSHIFT_HOST') }}"
      port: 5439
      database: orcavault
      schema: public
      region: ap-southeast-2
      threads: "{{ env_var('ORCAVAULT_DBT_THREADS', '4') | as_number }}"
      ra3_node: true
      datasharing: true
      # Retries opening a connection, for example while the workgroup resumes.
      retries: 3
