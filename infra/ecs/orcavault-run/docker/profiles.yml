# The profile for the runner, which replaces the one inside the orcavault repo.
orcavault:
  target: ecs
  outputs:
    ecs:
      type: redshift
      method: iam_role
      host: "{{ env_var('ORCAVAULT_REDSHIFT_HOST') }}"
      port: 5439
      database: orcavault
      schema: public
      region: ap-southeast-2
      threads: "{{ env_var('ORCAVAULT_DBT_THREADS', '4') | as_number }}"
      ra3_node: true
      datasharing: true
      retries: 3
