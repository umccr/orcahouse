[project]
name = "orcavault-runner"
version = "0.1.0"
requires-python = "==3.13.*"
dependencies = [
    "boto3~=1.34",
    "pydantic~=2.11",
    "pydantic-settings~=2.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build~=0.12.19"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
